name: Build tagged version

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Build production assets
        run: npm run build

      - name: Include project license
        run: cp LICENSE dist/LICENSE

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: racememoir-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
