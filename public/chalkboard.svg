<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <filter id="slate" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".48" numOctaves="3" stitchTiles="stitch" seed="4"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncR type="table" tableValues=".10 .27"/><feFuncG type="table" tableValues=".14 .31"/><feFuncB type="table" tableValues=".12 .28"/></feComponentTransfer>
    </filter>
    <filter id="dust" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".015 .06" numOctaves="2" stitchTiles="stitch" seed="17"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="400" height="400" fill="#28332f"/>
  <rect width="400" height="400" filter="url(#slate)" opacity=".55"/>
  <rect width="400" height="400" filter="url(#dust)" opacity=".045"/>
</svg>
